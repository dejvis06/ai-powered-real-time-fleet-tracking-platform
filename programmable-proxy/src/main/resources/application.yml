spring:
  application:
    name: programmable-proxy

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: 8084

proxy:
  eta-service-url: ${ETA_SERVICE_URL:http://localhost:8083}
  delivery-service-url: ${DELIVERY_SERVICE_URL:http://localhost:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true

logging:
  level:
    com.fleettracking: INFO
