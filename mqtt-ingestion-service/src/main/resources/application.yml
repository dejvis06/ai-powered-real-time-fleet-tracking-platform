spring:
  application:
    name: mqtt-ingestion-service
  main:
    web-application-type: none

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

mqtt:
  broker-url: ${MQTT_BROKER_URL:tcp://localhost:1883}
  client-id: ${MQTT_CLIENT_ID:mqtt-ingestion-service}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  server:
    port: 8085
  metrics:
    export:
      prometheus:
        enabled: true

logging:
  level:
    com.fleettracking: INFO
